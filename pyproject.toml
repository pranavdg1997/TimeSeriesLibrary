[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ts"
version = "0.1.0"
description = "Universal time series forecasting with multiple backend support"
authors = [{name = "Time Series Team"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["time-series", "forecasting", "prophet", "autogluon", "sktime", "darts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "holidays>=0.20",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
prophet = ["prophet>=1.1"]
autogluon = ["autogluon.timeseries>=0.8.0", "torch>=1.13.0"]
sktime = ["sktime>=0.20.0"]
darts = ["darts>=0.24.0", "torch>=1.13.0"]
all = [
    "prophet>=1.1",
    "autogluon.timeseries>=0.8.0",
    "sktime>=0.20.0",
    "darts>=0.24.0",
    "torch>=1.13.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/universal-ts"
Documentation = "https://github.com/yourusername/universal-ts"
Repository = "https://github.com/yourusername/universal-ts"

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_ts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
