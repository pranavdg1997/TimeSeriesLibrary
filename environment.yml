name: universal-ts
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.20.0
  - pandas>=1.3.0
  - matplotlib>=3.3.0
  - holidays>=0.20
  - pip

  # Optional backend dependencies
  - prophet>=1.1
  - sktime>=0.20.0
  - darts>=0.24.0

  # PyTorch (CPU or GPU)
  # CPU version
  # - pytorch>=1.13.0
  # - torchvision>=0.14.0
  # - torchaudio>=0.13.0

  # GPU version (uncomment and comment CPU version for GPU support)
  # - pytorch::pytorch>=1.13.0
  # - pytorch::torchvision>=0.14.0
  # - pytorch::torchaudio>=0.13.0

  # Development dependencies
  - pytest>=7.0
  - pytest-cov>=3.0
  - black>=22.0
  - flake8>=4.0
  - isort>=5.0

  # Pip-only dependencies
  - pip:
    # AutoGluon (pip-only)
    - autogluon.timeseries>=0.8.0

    # Development tools
    - build>=0.8.0
    - setuptools>=61.0
    - wheel>=0.37.0
